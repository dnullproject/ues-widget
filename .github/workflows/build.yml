name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle test assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ues-widget-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          export VERSION_NAME="${TAG#v}"
          export VERSION_CODE="${{ github.run_number }}"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"
          gradle assembleRelease
          cp app/build/outputs/apk/release/*.apk "ues-widget-${VERSION_NAME}.apk"
          gh release create "$TAG" "ues-widget-${VERSION_NAME}.apk" --title "$TAG" --generate-notes
